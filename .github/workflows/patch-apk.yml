name: Patch APK

# Pipeline completo: toma el bundle de patches publicado, parchea el APK base,
# firma con el keystore estable y publica el APK en el release "app-mod".
# El usuario solo entra a la página de releases y descarga.

on:
  workflow_dispatch:
    inputs:
      gate_patch:
        description: 'Incluir "Compatibilidad con integridad nativa (V29)" (variante base)'
        type: boolean
        default: true
      variant:
        description: 'Variantes a construir: ambas | origin | base'
        type: choice
        options: [ambas, origin, base]
        default: ambas
      patches_tag:
        description: 'Tag del release con el bundle .mpp (vacío = último prerelease dev)'
        required: false
        default: ''
  release:
    types: [published]

concurrency:
  group: patch-apk
  cancel-in-progress: false

jobs:
  patch:
    name: Patch + firmar + publicar
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolver tag del bundle
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.patches_tag }}
        run: |
          set -euo pipefail
          # Guarda: el propio job publica el release app-mod (con --clobber no se
          # re-dispara, pero la PRIMERA creación sí); no parchear el mod.
          if [ "$EVENT_TAG" = "app-mod" ]; then
            echo "Evento de publicación de app-mod: nada que hacer."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$EVENT_TAG" ] && [ "$EVENT_TAG" != "apks-trabajo" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease and (.tagName != "apks-trabajo")) | .tagName' \
              | head -1)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Variantes y gate normalizados (en evento release los inputs vienen vacíos)
          V="${{ inputs.variant }}"; [ -z "$V" ] && V=ambas
          G="${{ inputs.gate_patch }}"; [ -z "$G" ] && G=true
          echo "variant=$V" >> "$GITHUB_OUTPUT"
          echo "gate=$G" >> "$GITHUB_OUTPUT"
          echo "Bundle del release: $TAG (variantes: $V, gate: $G)"

      - name: Setup Java
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descargar CLI (morphe-desktop)
        if: steps.tag.outputs.tag != ''
        run: |
          curl -sL -o morphe-desktop.jar \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.2.0-dev.18/morphe-desktop-2.2.0-dev.18-all.jar
          ls -la morphe-desktop.jar

      - name: Descargar bundle de patches y APKs base
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'patches-*.mpp' -O patches.mpp
          gh release download apks-trabajo --repo "$GITHUB_REPOSITORY" \
            -p 'Proyecto.ORIGIN.apk' -O origin.apk
          gh release download apks-trabajo --repo "$GITHUB_REPOSITORY" \
            -p 'Proyecto.BASE.apk' -O base-limpio.apk
          ls -la patches.mpp origin.apk base-limpio.apk

      - name: Restaurar keystore de firma
        if: steps.tag.outputs.tag != ''
        env:
          KEYSTORE_B64: ${{ secrets.MORPHE_KEYSTORE_P12 }}
        run: echo "$KEYSTORE_B64" | base64 -d > morphe-personal.p12

      - name: Inyectar APK original como asset (equiv. LSPatch origin.apk)
        if: steps.tag.outputs.tag != ''
        run: |
          set -euo pipefail
          # La proteccion nativa llama Context.getPackageCodePath(), abre
          # java.util.zip.ZipFile y escanea las entradas del ZIP (incluidas las
          # *.apk) con SHA-256 via MessageDigest (disassembly en PLANO-MORPHE §8a).
          # Igual que LSPatch embebe assets/lspatch/origin.apk en su wrapper, aqui
          # se embebe el APK ORIGINAL como assets/orig/app.apk: SigSpoof v3 lo
          # extrae a cacheDir y redirige getPackageCodePath/getPackageResourcePath
          # y applicationInfo.sourceDir a ese archivo. Se agrega ANTES del parcheo
          # para que Morphe conserve el asset y lo firme en el APK final.
          python3 - <<'PY'
          import zipfile, shutil, os
          for src, dst in (('origin.apk', 'origin-wrap.apk'), ('base-limpio.apk', 'base-wrap.apk')):
              shutil.copyfile(src, dst)
              with zipfile.ZipFile(dst, 'a', zipfile.ZIP_DEFLATED) as z:
                  z.write(src, 'assets/orig/app.apk')
              print(dst, os.path.getsize(dst))
          PY

      - name: Listar patches del bundle (auditoría)
        if: steps.tag.outputs.tag != ''
        run: java -jar morphe-desktop.jar list-patches --patches patches.mpp

      - name: Parchear y firmar (variante ORIGIN)
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.variant != 'base'
        env:
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # ORIGIN: el build oficial 2.1.3 con BD pre-sembrada (el mismo que lleva
          # dentro el wrapper LSPatch del mod anterior). Sin protección nativa V29
          # PERO con el panel del mod viejo fusionado (classes4): su guardia n0/G.v
          # mata el proceso si la firma no es la original (bucle de splash infinito,
          # verificado: hash 366fa8f1... == SHA-256 del cert original). Matriz §7
          # de docs/PLANO-MORPHE.md: SigSpoof + neutralización n0/G + 3 funcionales.
          java -jar morphe-desktop.jar patch \
            --patches patches.mpp --exclusive \
            -e "Bypass del detector de AdBlock" \
            -e "Saltar anuncios de episodios" \
            -e "Recompensa instantánea de episodios" \
            -e "Firma original en PackageManager (V29)" \
            -e "Neutralizar antitamper del panel (n0/G)" \
            --keystore morphe-personal.p12 \
            --keystore-password "$MORPHE_KEYSTORE_PASSWORD" \
            -o kawaiianimes-mod-origin.apk \
            origin-wrap.apk
          ls -la kawaiianimes-mod-origin.apk

      - name: Parchear y firmar (variante BASE LIMPIO)
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.variant != 'origin'
        env:
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
          GATE_PATCH: ${{ steps.tag.outputs.gate }}
        run: |
          set -euo pipefail
          # BASE LIMPIO: app-release.apk oficial (animelhd), el que el usuario usa
          # en su flujo Morphe Manager. Tiene la protección nativa V29 de fábrica:
          # gate confirmRuntimeV29 + proofs de firma para /api/sync y streams.
          # NUNCA incluir el patch n0/G aquí (esa clase no existe y abortaría el
          # run). El gate V29 respeta el input gate_patch (default true). Matriz
          # §7 de docs/PLANO-MORPHE.md; desde dev.11 la verificación nativa pasa
          # porque el CI embebe el APK ORIGINAL y SigSpoof v3 redirige la lectura.
          ARGS=(
            --patches patches.mpp --exclusive
            -e "Bypass del detector de AdBlock"
            -e "Saltar anuncios de episodios"
            -e "Recompensa instantánea de episodios"
            -e "Firma original en PackageManager (V29)"
          )
          if [ "$GATE_PATCH" = "true" ]; then
            ARGS+=(-e "Compatibilidad con integridad nativa (V29)")
          fi
          java -jar morphe-desktop.jar patch \
            "${ARGS[@]}" \
            --keystore morphe-personal.p12 \
            --keystore-password "$MORPHE_KEYSTORE_PASSWORD" \
            -o kawaiianimes-mod-base.apk \
            base-wrap.apk
          ls -la kawaiianimes-mod-base.apk

      - name: Publicar APKs en el release app-mod
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VARIANT: ${{ steps.tag.outputs.variant }}
        run: |
          set -euo pipefail
          # El nombre incluye el tag del bundle y la variante para que no se
          # confundan descargas viejas ni variantes distintas (dev.5-dev.9+).
          BUNDLE_VERSION="$TAG"
          ASSET_ORIGIN="kawaiianimes-2.1.3-mod-${BUNDLE_VERSION}-origin.apk"
          ASSET_BASE="kawaiianimes-2.1.3-mod-${BUNDLE_VERSION}-base.apk"
          ASSETS=()
          if [ -f kawaiianimes-mod-origin.apk ] && [ "$VARIANT" != "base" ]; then
            cp kawaiianimes-mod-origin.apk "$ASSET_ORIGIN"
            ASSETS+=("$ASSET_ORIGIN")
          fi
          if [ -f kawaiianimes-mod-base.apk ] && [ "$VARIANT" != "origin" ]; then
            cp kawaiianimes-mod-base.apk "$ASSET_BASE"
            ASSETS+=("$ASSET_BASE")
          fi
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "Nada que publicar (variant=$VARIANT sin artefactos)."; exit 1
          fi
          NOTES=$(cat <<'EOF'
          APK de Kawaii Animes 2.1.3 parcheado en CI (dev.11+: fábrica con APK original embebido). Misma firma estable (instalable encima):

          **-origin** (recomendada, probar primero): build oficial con BD del catálogo pre-sembrada (carga al instante) y el panel del mod anterior, cuyo antitamper (n0/G) está neutralizado. Equivalente al APK LSPatch que sí funcionaba.
          - Patches: Saltar anuncios, Recompensa instantánea, Bypass AdBlock, Firma original (SigSpoof v3), Antitamper del panel neutralizado.

          **-base** (base limpio oficial, flujo Morphe Manager): app-release.apk del repo oficial con su protección nativa V29 de fábrica. Desde dev.11 la verificación nativa pasa: el CI embebe el APK ORIGINAL como asset (equivalente a LSPatch origin.apk) y SigSpoof v3 redirige getPackageCodePath/getPackageResourcePath + sourceDir a él, además del gate V29 forzado y el spoof de PackageManager/hasSigningCertificate. Confirmado byte a byte que el embebido es idéntico al original (v2.1.3, code 29).
          - Patches: Saltar anuncios, Recompensa instantánea, Bypass AdBlock, Compatibilidad integridad nativa (V29), Firma original (SigSpoof v3).

          Verificación sin ADB: Android/data/com.darkdeveloper.kawaiianimes/files/sigspoof.log debe mostrar "redirect: APK original extraido".
          Si venías de la versión LSPatch o del Manager, desinstala primero.
          Bundle de patches: reemplazar-esta-linea
          EOF
          )
          NOTES="${NOTES/reemplazar-esta-linea/$BUNDLE_VERSION}"
          if gh release view app-mod --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload app-mod "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit app-mod --repo "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease
          else
            gh release create app-mod "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Kawaii Animes parcheado (mod)" --notes "$NOTES" --prerelease
          fi
          echo "APKs publicados en app-mod: ${ASSETS[*]} (bundle $BUNDLE_VERSION)"
