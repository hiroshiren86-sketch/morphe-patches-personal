name: Patch APK

# Pipeline completo: toma el bundle de patches publicado, parchea el APK base,
# firma con el keystore estable y publica el APK en el release "app-mod".
# El usuario solo entra a la página de releases y descarga.

on:
  workflow_dispatch:
    inputs:
      gate_patch:
        description: 'Incluir "Compatibilidad con integridad nativa (V29)"'
        type: boolean
        default: true
      patches_tag:
        description: 'Tag del release con el bundle .mpp (vacío = último prerelease dev)'
        required: false
        default: ''
  release:
    types: [published]

concurrency:
  group: patch-apk
  cancel-in-progress: false

jobs:
  patch:
    name: Patch + firmar + publicar
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolver tag del bundle
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.patches_tag }}
        run: |
          set -euo pipefail
          # Guarda: el propio job publica el release app-mod (con --clobber no se
          # re-dispara, pero la PRIMERA creación sí); no parchear el mod.
          if [ "$EVENT_TAG" = "app-mod" ]; then
            echo "Evento de publicación de app-mod: nada que hacer."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$EVENT_TAG" ] && [ "$EVENT_TAG" != "apks-trabajo" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease and (.tagName != "apks-trabajo")) | .tagName' \
              | head -1)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bundle del release: $TAG"

      - name: Setup Java
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descargar CLI (morphe-desktop)
        if: steps.tag.outputs.tag != ''
        run: |
          curl -sL -o morphe-desktop.jar \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.2.0-dev.18/morphe-desktop-2.2.0-dev.18-all.jar
          ls -la morphe-desktop.jar

      - name: Descargar bundle de patches y APK base
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'patches-*.mpp' -O patches.mpp
          gh release download apks-trabajo --repo "$GITHUB_REPOSITORY" -p 'Proyecto.BASE.apk' -O base.apk
          ls -la patches.mpp base.apk

      - name: Restaurar keystore de firma
        if: steps.tag.outputs.tag != ''
        env:
          KEYSTORE_B64: ${{ secrets.MORPHE_KEYSTORE_P12 }}
        run: echo "$KEYSTORE_B64" | base64 -d > morphe-personal.p12

      - name: Listar patches del bundle (auditoría)
        if: steps.tag.outputs.tag != ''
        run: java -jar morphe-desktop.jar list-patches --patches patches.mpp

      - name: Parchear y firmar el APK
        if: steps.tag.outputs.tag != ''
        env:
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
          GATE: ${{ inputs.gate_patch }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${GATE:-true}" != "false" ]; then
            ARGS+=(-e "Compatibilidad con integridad nativa (V29)")
          fi
          java -jar morphe-desktop.jar patch \
            --patches patches.mpp "${ARGS[@]}" \
            --keystore morphe-personal.p12 \
            --keystore-password "$MORPHE_KEYSTORE_PASSWORD" \
            -o kawaiianimes-mod.apk \
            base.apk
          ls -la kawaiianimes-mod.apk

      - name: Publicar APK en el release app-mod
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ASSET="kawaiianimes-2.1.3-mod.apk"
          cp kawaiianimes-mod.apk "$ASSET"
          BUNDLE_VERSION=$(basename patches.mpp .mpp | sed 's/^patches-//')
          NOTES=$(cat <<'EOF'
          APK de Kawaii Animes 2.1.3 parcheado automáticamente en CI.

          - Patches: los 3 por defecto + Compatibilidad con integridad nativa (V29)
          - Firma estable (misma clave en todos los builds: se puede instalar encima)
          - Librerías nativas completas (libprotection.so es necesaria para el gate)
          - Bundle de patches: reemplazar-esta-linea

          Desinstala la versión anterior solo si viene de otra firma (p. ej. la de LSPatch o la del Manager).
          EOF
          )
          NOTES="${NOTES/reemplazar-esta-linea/$BUNDLE_VERSION}"
          if gh release view app-mod --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload app-mod "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit app-mod --repo "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease
          else
            gh release create app-mod "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --title "Kawaii Animes parcheado (mod)" --notes "$NOTES" --prerelease
          fi
          echo "APK publicado en el release app-mod ($ASSET), bundle $BUNDLE_VERSION"
